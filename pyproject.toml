[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | migrations
  | staticfiles
  | media
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "EduXJY.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["AIQandA/tests"]
addopts = "-q --cov=AIQandA --cov-report=term-missing"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
