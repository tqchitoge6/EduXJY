upstream eduxjy_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name 121.40.192.55 xiaojunyang;

    client_max_body_size 12m;
    server_tokens off;

    access_log /var/log/nginx/eduxjy.access.log;
    error_log /var/log/nginx/eduxjy.error.log;

    location = /healthz/ {
        proxy_pass http://eduxjy_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location /static/ {
        alias /opt/EduXJY/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Uploaded source files are for internal indexing only.
    location /media/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://eduxjy_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_redirect off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
